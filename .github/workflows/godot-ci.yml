name: Poop Smash Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poop-smash-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_RELEASE: '4.7.2-stable'
  GODOT_TEMPLATE_VERSION: '4.7.2.stable'

jobs:
  android-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.1"
      - name: Install pinned Godot and Android templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          base="https://github.com/godotengine/godot/releases/download/$GODOT_RELEASE"
          curl -fL --retry 3 "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o "$RUNNER_TEMP/editor.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/editor.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/editor.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64"
          ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl -fL --retry 3 "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $RUNNER_TEMP/templates.tpz" | sha256sum -c -
          unzip -j -q "$RUNNER_TEMP/templates.tpz" "templates/android_debug.apk" "templates/version.txt" -d "$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          godot --version
      - name: Import resources
        run: godot --headless --path . --editor --import --quit
      - name: Run squish rules tests
        run: godot --headless --path . --script res://tests/test_squish_rules.gd
      - name: Boot playable scene
        run: godot --headless --path . --quit-after 5
      - name: Configure debug keystore
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" build
          if [[ -n "$DEBUG_KEYSTORE_BASE64" ]]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=CI,C=US"
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Configure Godot SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          EOF
      - name: Build debug APK
        run: |
          sed -i -E "s/^version\\/code=[0-9]+$/version\\/code=$((1000 + GITHUB_RUN_NUMBER))/" export_presets.cfg
          godot --headless --path . --export-debug "Android" build/poop-smash-debug.apk
          test -s build/poop-smash-debug.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging build/poop-smash-debug.apk | grep "com.spidersu.poopsmash"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: poop-smash-debug-apk
          path: build/poop-smash-debug.apk
          retention-days: 14
          if-no-files-found: error
