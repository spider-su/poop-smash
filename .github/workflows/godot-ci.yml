name: Poop Smash Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      release_aab:
        description: Build a Play-uploadable, release-signed Android App Bundle
        required: false
        type: boolean
        default: false
      release_version_code:
        description: Version code accepted by Play Console (must exceed the last uploaded code)
        required: false
        type: string
      release_version_name:
        description: User-visible Android version name
        required: false
        type: string
        default: '0.1.0'

permissions:
  contents: read

concurrency:
  group: poop-smash-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_RELEASE: '4.7.2-stable'
  GODOT_TEMPLATE_VERSION: '4.7.2.stable'

jobs:
  android-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Android SDK
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.1" "platforms;android-36" "build-tools;36.0.0"
      - name: Install pinned Godot and Android templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          base="https://github.com/godotengine/godot/releases/download/$GODOT_RELEASE"
          curl -fL --retry 3 "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o "$RUNNER_TEMP/editor.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/editor.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/editor.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64"
          ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl -fL --retry 3 "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $RUNNER_TEMP/templates.tpz" | sha256sum -c -
          unzip -j -q "$RUNNER_TEMP/templates.tpz" "templates/android_debug.apk" "templates/android_source.zip" "templates/version.txt" -d "$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          "$RUNNER_TEMP/godot/godot" --version
      - name: Import resources
        run: bash scripts/check_godot.sh godot --headless --path . --editor --import --quit
      - name: Run all rule and integration tests
        run: |
          for test in tests/test_*.gd; do
            bash scripts/check_godot.sh godot --headless --path . --script "res://$test"
          done
      - name: Boot playable scene
        run: bash scripts/check_godot.sh godot --headless --path . --quit-after 120
      - name: Install software display for real game captures
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Capture actual game on portrait, short and tall displays
        run: |
          for spec in "portrait 540x960" "short 540x720" "tall 540x1200"; do
            read -r label resolution <<< "$spec"
            bash scripts/check_godot.sh xvfb-run -a -s "-screen 0 1600x1800x24" godot --path . --resolution "$resolution" --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/capture_visuals.gd -- --output="$RUNNER_TEMP/visuals/$label"
            test "$(find "$RUNNER_TEMP/visuals/$label" -name '*.png' | wc -l)" -eq 11
          done
      - name: Upload game screenshots
        uses: actions/upload-artifact@v7
        with:
          name: poop-smash-visuals
          path: ${{ runner.temp }}/visuals
          retention-days: 14
          if-no-files-found: error
      - name: Configure debug keystore
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" build
          if [[ -n "$DEBUG_KEYSTORE_BASE64" ]]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=CI,C=US"
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Configure Godot SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          EOF
      - name: Build debug APK
        run: |
          sed -i -E "s/^version\\/code=[0-9]+$/version\\/code=$((1000 + GITHUB_RUN_NUMBER))/" export_presets.cfg
          bash scripts/check_godot.sh godot --headless --path . --export-debug "Android" build/poop-smash-debug.apk
          test -s build/poop-smash-debug.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging build/poop-smash-debug.apk | grep "com.spidersu.poopsmash"
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump permissions build/poop-smash-debug.apk > "$RUNNER_TEMP/apk-permissions.txt"
          grep -q "android.permission.VIBRATE" "$RUNNER_TEMP/apk-permissions.txt"
          if grep -q "android.permission.INTERNET" "$RUNNER_TEMP/apk-permissions.txt"; then
            echo "Prototype must remain offline"
            exit 1
          fi
      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: poop-smash-debug-apk
          path: build/poop-smash-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Build debug Android App Bundle
        run: |
          sed -i -E "s/^version\\/code=[0-9]+$/version\\/code=$((1000 + GITHUB_RUN_NUMBER))/" export_presets.cfg
          bash scripts/check_godot.sh godot --headless --path . --install-android-build-template --export-debug "Android AAB" build/poop-smash-debug.aab
          test -s build/poop-smash-debug.aab
          unzip -tq build/poop-smash-debug.aab
          unzip -Z1 build/poop-smash-debug.aab > "$RUNNER_TEMP/aab-entries.txt"
          grep -Eq '(^|/)AndroidManifest.xml$' "$RUNNER_TEMP/aab-entries.txt"
          jarsigner -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -sigalg SHA256withRSA -digestalg SHA-256 -signedjar build/poop-smash-debug-signed.aab build/poop-smash-debug.aab androiddebugkey
          jarsigner -verify build/poop-smash-debug-signed.aab
      - name: Upload debug Android App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: poop-smash-debug-aab
          path: build/poop-smash-debug-signed.aab
          retention-days: 14
          if-no-files-found: error

  android-release-aab:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_aab
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Android SDK
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install pinned Godot and Android templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          base="https://github.com/godotengine/godot/releases/download/$GODOT_RELEASE"
          curl -fL --retry 3 "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o "$RUNNER_TEMP/editor.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/editor.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/editor.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64"
          ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl -fL --retry 3 "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $RUNNER_TEMP/templates.tpz" | sha256sum -c -
          unzip -j -q "$RUNNER_TEMP/templates.tpz" "templates/android_debug.apk" "templates/android_release.apk" "templates/android_source.zip" "templates/version.txt" -d "$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          "$RUNNER_TEMP/godot/godot" --version
      - name: Import resources and run gameplay tests
        run: |
          set -euo pipefail
          bash scripts/check_godot.sh godot --headless --path . --editor --import --quit
          for test in tests/test_*.gd; do
            bash scripts/check_godot.sh godot --headless --path . --script "res://$test"
          done
          bash scripts/check_godot.sh godot --headless --path . --quit-after 120
      - name: Validate release inputs and configure upload key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          RELEASE_VERSION_CODE: ${{ inputs.release_version_code }}
          RELEASE_VERSION_NAME: ${{ inputs.release_version_name }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_KEY_ALIAS" || -z "$RELEASE_KEY_PASSWORD" ]]; then
            echo "Missing ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_KEY_ALIAS, or ANDROID_RELEASE_KEY_PASSWORD repository secrets."
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "Set release_version_code to the next unused positive version code in Play Console."
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION_NAME" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "Set release_version_name to a simple non-empty version string (letters, digits, dot, underscore, plus, or hyphen)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release-key" build
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key/upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/release-key/upload.jks" -storepass "$RELEASE_KEY_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release-key/upload.jks"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$RELEASE_KEY_ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          sed -i -E "s/^version\/code=[0-9]+$/version\/code=$RELEASE_VERSION_CODE/; s/^version\/name=.*/version\/name=\"$RELEASE_VERSION_NAME\"/" export_presets.cfg
          {
            echo "RELEASE_VERSION_CODE=$RELEASE_VERSION_CODE"
            echo "RELEASE_VERSION_NAME=$RELEASE_VERSION_NAME"
          } >> "$GITHUB_ENV"
      - name: Configure Godot SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Export and verify release-signed AAB
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check_godot.sh godot --headless --path . --install-android-build-template --export-release "Android AAB" build/poop-smash-release.aab
          test -s build/poop-smash-release.aab
          unzip -tq build/poop-smash-release.aab
          jarsigner -verify build/poop-smash-release.aab
          keytool -printcert -jarfile build/poop-smash-release.aab > build/poop-smash-release-certificate.txt
          expected_fingerprint=$(keytool -list -v -keystore "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" -storepass "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" -alias "$GODOT_ANDROID_KEYSTORE_RELEASE_USER" | awk '/SHA256:/{print $2; exit}' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          actual_fingerprint=$(awk '/SHA256:/{print $2; exit}' build/poop-smash-release-certificate.txt | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          if [[ -z "$expected_fingerprint" || "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "Release AAB signing certificate does not match the configured Play upload key."
            exit 1
          fi
          {
            echo "package=com.spidersu.poopsmash"
            echo "version_name=$RELEASE_VERSION_NAME"
            echo "version_code=$RELEASE_VERSION_CODE"
            echo "source_commit=$GITHUB_SHA"
            echo "sha256=$(sha256sum build/poop-smash-release.aab | cut -d ' ' -f 1)"
            echo "signing_certificate_sha256=$(awk '/SHA256:/{print $2; exit}' build/poop-smash-release-certificate.txt)"
          } > build/poop-smash-release-metadata.txt
      - name: Upload release AAB and signing metadata
        uses: actions/upload-artifact@v7
        with:
          name: poop-smash-release-aab
          path: |
            build/poop-smash-release.aab
            build/poop-smash-release-certificate.txt
            build/poop-smash-release-metadata.txt
          retention-days: 30
          if-no-files-found: error
